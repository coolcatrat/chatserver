<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Go Chatroom — Barebones Client</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- compact window centered on the page -->
  <div id="appWindow">

  <!-- Connection status: JS flips this text when the socket opens / closes. -->
  <div id="connectionStatusBar">status: <span id="connectionStatusIndicator">disconnected</span></div>

  <div id="applicationBody">

    <!-- ============ SIDEBAR (two windows: global list + DM list) ============ -->
    <nav id="sidebar">

      <!-- Global / public rooms. v1 has just one entry: #global. -->
      <h2>GLOBAL CHAT</h2>
      <div id="globalChatRoomList">
        <div class="roomListEntry" data-room-identifier="global">#global</div>
      </div>

      <!-- Direct messages. Empty for now; JS adds entries during the DM rung. -->
      <h2>DIRECT MESSAGES</h2>
      <div id="directMessageList">
        <!-- JS will append one .roomListEntry per DM partner here -->
      </div>

    </nav>

    <!-- ============ CHATBOX (third window: the open conversation) ============ -->
    <section id="chatbox">

      <!-- Name of whichever room/DM is open. JS rewrites this on room switch. -->
      <h1 id="currentRoomHeading">#global</h1>

      <!-- Incoming messages get appended here as child elements. -->
      <div id="messageDisplayWindow">
        <!-- JS will append one .messageLine per received message -->
      </div>

      <!-- Composer: where the user types and sends. -->
      <div id="messageComposer">
        <input id="messageInputField" type="text" placeholder="type a message..." autocomplete="off" />
        <button id="sendMessageButton">Send</button>
      </div>

    </section>

  </div>

  </div>

  <!-- Your behavior lives here. Loaded after the HTML so every element above
       already exists in the document by the time your code runs. -->
  <script src="app.js"></script>

</body>
</html>
